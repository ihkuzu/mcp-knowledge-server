services:
  mcp:
    build: .
    environment:
      MCPKB_TOKEN: ${MCPKB_TOKEN:-}
      MCPKB_INFERQ_URL: ${MCPKB_INFERQ_URL:-}
    ports: ["8000:8000"]

  # optional: the inference service from github.com/ihkuzu/async-inference-service
  redis:
    image: redis:7-alpine
    profiles: [jobs]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  inferq-api:
    build: https://github.com/ihkuzu/async-inference-service.git#main
    profiles: [jobs]
    command: ["inferq", "api"]
    environment: &inferq
      INFERQ_BACKEND: redis
      INFERQ_REDIS_URL: redis://redis:6379/0
      INFERQ_PREDICTOR: simulated
    depends_on:
      redis: { condition: service_healthy }

  inferq-worker:
    build: https://github.com/ihkuzu/async-inference-service.git#main
    profiles: [jobs]
    command: ["inferq", "worker"]
    environment:
      <<: *inferq
      INFERQ_WORKER_ID: worker-1
    depends_on:
      redis: { condition: service_healthy }
